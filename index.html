<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>In the Trees</title>
<style>
  :root { color-scheme: light; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: linear-gradient(#f4a261, #9b5a6e 55%, #2b2d42);
    font-family: Georgia, "Times New Roman", serif; color: #fff8ec; text-align: center; padding: 16px;
  }
  h1 { font-size: clamp(2.5rem, 9vw, 5rem); margin: 0 0 0.2em; text-shadow: 0 3px 0 #2b2d42; }
  p { margin: 0 0 2em; font-size: 1.1rem; }
  a {
    display: inline-block; padding: 0.8em 2.2em; border-radius: 14px; background: #4caf50; color: #fff;
    font: bold 1.3rem system-ui, sans-serif; text-decoration: none; box-shadow: 0 5px 0 #2e7d32;
  }
  a:hover { background: #57c05b; }
  a:active { transform: translateY(3px); box-shadow: 0 2px 0 #2e7d32; }
</style>
</head>
<body>
  <main>
    <h1>In the Trees</h1>
    <p>Get back down.</p>
    <a href="https://in-the-trees.vercel.app/" target="_self">Play</a>
  </main>

</html>
